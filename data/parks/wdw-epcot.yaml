# EPCOT — park config, schema 1.0
# Built in M17 from the osm-import draft (osm/wdw-epcot/import.yaml) plus sourced attributes; edited by hand from here on.
# Geometry © OpenStreetMap contributors, ODbL 1.0 (https://www.openstreetmap.org/copyright).
# x, y: feet east and south of the park's north-west corner (28.376656, -81.554433) [osm].
# Edge lengths follow the OSM path geometry [osm]; widths are defaults by path type [assumed].
# Names, lands and map numbers: 2026 guide map (Jason) [map]. Research 2026-10-19: ride capacities crooksinwdw (operational, 2019) or
# Wikipedia x 90% (Jason's rule), Lightning Lane tiers TouringPlans 2026-06-29, shows and hours TouringPlans / fan sites 2026.
# World Showcase as an area opens with the park; its restaurants, shops and the two Circle-Vision films open ~11:00 [fan Ziggy 2026]
# (node hours, M17). Two gates: main entrance and International Gateway (share [assumed], Jason 2026-10-19).
# Not modeled yet: Luminous (21:00 lagoon show), the Food & Wine Festival booths (Jason), Friendship boats, Play Zone, and the
# places listed at the end of osm/wdw-epcot/import.yaml. Attractions inside large buildings attach by straight links of up to ~330 ft.


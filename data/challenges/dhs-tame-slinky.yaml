# M15 challenge; goals re-set 2026-10-19 after the M16 turn-away fix and realism pass. The no-lever day misses the Slinky goals
# (62.2 / 88.5 min; score 50.40, 8,575 used); a known play meets all four (Slinky LL inventory 0.1 and merge 1:1 at opening:
# 54.7 / 66.1 min, 50.28, 8,471 used).
schema_version: "1.0"
challenge:
  id: dhs_tame_slinky
  title: "Tame Slinky"
  description: "A medium day at Hollywood Studios. Bring Slinky Dog Dash's standby wait down without hurting the day or shutting out Lightning Lane guests."
  scenario: dhs_medium_day
  scoring: guest_experience
  levers: [ll_inventory, ll_merge, single_rider_open, single_rider_close, add_train, remove_train]
  goals:
    - { metric: posted_avg_min, node: slinky_dog_dash, at_most: 55 }
    - { metric: posted_peak_min, node: slinky_dog_dash, at_most: 72 }
    - { metric: score, at_least: 50.25 }      # the no-lever day scores 50.40: keep the day while taming Slinky
    - { metric: ll_redeemed, at_least: 8400 } # the no-lever day uses 8,575 passes

# M15 daily challenge: every player of a date plays the same day (seed = YYYYMMDD). No-lever days on 2026-10-19..21
# score 47.10-47.93 with 7,988-8,106 passes used.
schema_version: "1.0"
challenge:
  id: dhs_daily
  title: "Daily medium day"
  description: "Today's medium day at Hollywood Studios. Post the best score on the leaderboard while still serving Lightning Lane guests."
  scenario: dhs_medium_day
  scoring: guest_experience
  daily_seed: true
  levers: [ll_inventory, ll_merge, single_rider_open, single_rider_close, add_train, remove_train]
  goals:
    - { metric: score, at_least: 47 }
    - { metric: ll_redeemed, at_least: 7500 }

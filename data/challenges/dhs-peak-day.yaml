# M15 challenge; goals re-set 2026-10-19 after the M16 turn-away fix and realism pass. The no-lever day scores 36.33 with 19,511
# balks and 11,575 passes used; a known play meets all three (Tier 1 LL inventory 0.2 and merge 1:1 on Tier 1 and Rise at
# opening: 36.44, 18,430 balks, 10,994 used). Cutting all LL inventory scores higher but fails the passes goal.
schema_version: "1.0"
challenge:
  id: dhs_peak_day
  title: "Peak day"
  description: "A high-crowd day at Hollywood Studios. Turn fewer guests away and lift the day while still serving Lightning Lane guests."
  scenario: dhs_high_day
  scoring: guest_experience
  levers: [ll_inventory, ll_merge, single_rider_open, single_rider_close, add_train, remove_train]
  goals:
    - { metric: score, at_least: 36.4 }
    - { metric: balks, at_most: 19000 }
    - { metric: ll_redeemed, at_least: 10900 }

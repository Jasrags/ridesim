# Star Wars: Rise of the Resistance (Disney's Hollywood Studios) — ride config, schema 1.0 (M11)
# Confidence tags: [wiki] = Wikipedia, [fan] = forum/fan sources, [patent] = ride-system patent, [assumed] = our placeholder
# Research pass 2026-10-18 (pages fetched; quotes via an extraction model, so near-verbatim):
#   wiki  https://en.wikipedia.org/wiki/Star_Wars:_Rise_of_the_Resistance
#   tp    https://forum.touringplans.com/t/rise-of-the-resistance-anxiety-am-i-alone/78876?page=4 (TouringPlans counts)
#   dg    https://blog.disneygeek.com/2020/01/12/star-wars-rise-of-the-resistance-my-experience-attraction-overview (WDW)
#   zk    https://ziggyknowsdisney.com/star-wars-rise-of-the-resistance-ride-details/
#   tpd   https://touringplans.com/blog/downtime-details-hollywood-studios/
#   bm    https://blogmickey.com/2020/02/how-often-does-star-wars-rise-of-the-resistance-break-down/
#
# Guest path [wiki][fan dg]: briefing room (Rey hologram) -> Intersystem Transport Ship (standing motion simulator) -> hangar walk
# -> holding cell (groups of up to 16) -> two 8-seat trackless Fleet Transports per cell group -> scenes, escape pod drop -> unload.
# Model (Jason, 2026-10-18): the briefing room is the preshow; the ship and the cells are further batch `stages`; each pair of
# vehicles that boards from one cell runs as one 16-seat "train" through scene blocks (multi_train_coaster). The hangar walk adds
# experience time only and is not modeled.
# Capacity target (Jason): ~1,540/hr, TouringPlans' counted hour, so the [assumed] station times give one pair every 37.4 s.

schema_version: "1.0"

ride:
  id: wdw.dhs.rise_of_the_resistance   # <resort>.<park>.<ride>, unique across all parks
  family: rise_of_the_resistance
  name: "Star Wars: Rise of the Resistance"
  location:
    resort: walt_disney_world
    park: disneys_hollywood_studios
    land: galaxys_edge                 # [wiki] Star Wars: Galaxy's Edge
  other_versions:
    - { resort: disneyland_resort, park: disneyland, status: operating, note: "same attraction; downtime figures found were Disneyland's, not used here" }
  archetype: multi_train_coaster       # trackless vehicle pairs on scene blocks; see header
  ride_duration_s: 300                 # [fan zk][fan dg] "roughly 5 minutes" on the trackless transport; whole experience 18 min [wiki]
  height_restriction_in: 40            # [wiki]
  listed_capacity_per_hr: 1700         # [fan zk] "1,500 - 1,700 per hour"; TouringPlans "best hourly throughput ... around 1,700" (hearsay) [fan tp]
  data_conflicts:
    - field: listed_capacity_per_hr
      values: { fan_zk_range_top: 1700, fan_tp_counted_2021: 1535, fan_tp_counted_peak_2020: 1578, fan_tp_best_hearsay: 1700 }
      chosen: fan_zk_range_top
      note: "Listed figure for checks only. The model is built to the counted ~1,540/hr (Jason, 2026-10-18)."

trains:                                # one train = the two vehicles that board from one holding cell
  fleet_size: 19                       # [fan zk] "38 total ride cars", in pairs
  max_in_service: 18                   # [fan zk] "36 cars can be in the 'show space' at one time"
  default_in_service: 12               # [assumed] lap 300 + 30 + 37.4 = 367 s needs >= 10 pairs at 37.4 s; 12 leave slack
  cars_per_train: 2                    # [wiki] guests "board two Prisoner Transport Units"; [fan dg] "one of two waiting" transports
  seats_per_train: 16                  # [wiki] 8 riders per vehicle, 2 rows of 4
  seats_per_row: 1                     # [assumed] the cell's group of up to 16 fills both vehicles; parties share the 4-seat rows
  layout: "2 vehicles x 2 rows of 4"   # [wiki]
  restraints: lap_bar                  # [assumed] not in the fetched sources

# 18 show areas and 4 ride systems [fan zk]; no scene list with timings was found. The vehicle portion (300 s) is split into
# 15 equal scene blocks, the escape pod drop ("a concealed drop tower set atop a motion simulator" [wiki]) and the run to unload,
# all [assumed]. Each block is a stopping point that holds one pair; every one is shorter than the 37.4 s station interval.
blocks:
  - { id: UNLOAD, kind: station, next: LOAD }
  - { id: LOAD, kind: station, next: SCENE_01 }
  - { id: SCENE_01, kind: brake, transit_s: { mean: 16, sd: 1 }, brake: &scene { hold_capable: true, stop_policy: stop_if_next_occupied, release_delay_s: { mean: 1, sd: 0.3 } }, next: SCENE_02 }   # [assumed]
  - { id: SCENE_02, kind: brake, transit_s: { mean: 16, sd: 1 }, brake: *scene, next: SCENE_03 }
  - { id: SCENE_03, kind: brake, transit_s: { mean: 16, sd: 1 }, brake: *scene, next: SCENE_04 }
  - { id: SCENE_04, kind: brake, transit_s: { mean: 16, sd: 1 }, brake: *scene, next: SCENE_05 }
  - { id: SCENE_05, kind: brake, transit_s: { mean: 16, sd: 1 }, brake: *scene, next: SCENE_06 }
  - { id: SCENE_06, kind: brake, transit_s: { mean: 16, sd: 1 }, brake: *scene, next: SCENE_07 }
  - { id: SCENE_07, kind: brake, transit_s: { mean: 16, sd: 1 }, brake: *scene, next: SCENE_08 }
  - { id: SCENE_08, kind: brake, transit_s: { mean: 16, sd: 1 }, brake: *scene, next: SCENE_09 }
  - { id: SCENE_09, kind: brake, transit_s: { mean: 16, sd: 1 }, brake: *scene, next: SCENE_10 }
  - { id: SCENE_10, kind: brake, transit_s: { mean: 16, sd: 1 }, brake: *scene, next: SCENE_11 }
  - { id: SCENE_11, kind: brake, transit_s: { mean: 16, sd: 1 }, brake: *scene, next: SCENE_12 }
  - { id: SCENE_12, kind: brake, transit_s: { mean: 16, sd: 1 }, brake: *scene, next: SCENE_13 }
  - { id: SCENE_13, kind: brake, transit_s: { mean: 16, sd: 1 }, brake: *scene, next: SCENE_14 }
  - { id: SCENE_14, kind: brake, transit_s: { mean: 16, sd: 1 }, brake: *scene, next: SCENE_15 }
  - { id: SCENE_15, kind: brake, transit_s: { mean: 16, sd: 1 }, brake: *scene, next: ESCAPE_POD }
  - { id: ESCAPE_POD, kind: brake, transit_s: { mean: 30, sd: 2 }, brake: *scene, next: PRE_UNLOAD }   # [assumed] the drop finale
  - { id: PRE_UNLOAD, kind: brake, transit_s: { mean: 30, sd: 2 }, brake: *scene, next: UNLOAD }       # [assumed] run to the unload dock
  # transit sum = 15 x 16 + 30 + 30 = 300 = ride_duration_s

clearance:
  rules:
    - { id: dispatch_to_unload, from: PRE_UNLOAD, requires_empty: [UNLOAD], conditions: [{ kind: load_clear_to_advance }] }

station:
  separate_load_unload: true           # [wiki][fan dg] vehicles wait at the holding cell's doors; guests leave at a separate unload
  unload_s:        { mean: 30, sd: 6 } # [assumed]
  load_s:          { mean: 26.4, sd: 6 } # [assumed] set for the 37.4 s / ~1,540/hr target (26.4 + 8 + 3), decision 2026-10-18
  restraint_check_s: { mean: 8, sd: 2 }# [assumed]
  dispatch_clearance_s: { mean: 3, sd: 1 }   # [assumed]
  target_dispatch_interval_s: 37.4     # derived: 3600 x 16 / 1540 (Jason, 2026-10-18)
  min_dispatch_interval_s: 30          # [assumed]
  staff_at_station: 6                  # [assumed]
  dispatch_rule: hold_for_full_or_max_wait
  max_wait_after_ready_s: 5            # [assumed]

failures:
  # Rise has the most downtime at Walt Disney World: ~11% (2022 ~12%, 2023 ~10%) [fan tpd]; ~3.6 breakdowns a day (stalls over
  # 15 min, early 2020) [fan bm]; down at park opening ~25% of the time [fan TouringPlans]. Fitted (Jason, 2026-10-18): 12 h / 3.6 =
  # 3.33 h between long stops of ~16 min (58 min a day) + brief stops (~14 min) + late openings (0.25 x 45 = ~11 min) = ~83 min,
  # 11.5% of a 12 h day. (Long stops were 19 min before opening delays were modeled; see tuning-log.)
  brief_stop:
    rate_per_hr: 0.4                   # [assumed] as the other rides
    duration_s: { mean: 180, sd: 60 }  # [assumed]
  long_downtime:
    mtbf_hr: 3.33                      # fitted to [fan bm] 3.6 a day
    mttr_min: { mean: 16, sd: 7 }      # fitted to [fan tpd] ~11% downtime with opening delays (was 19 +- 8)
  opening_delay:                       # [fan TouringPlans] "Rise is down at park opening about 25% of the time"
    probability: 0.25
    duration_s: { mean: 2700, sd: 1800 }   # [assumed] 45 +- 30 min
  weather_hold: scripted

preshow:                               # briefing room [fan dg]: "two briefing rooms and they are mirrors of each other"
  enabled: true
  rooms: 2                             # [fan dg]
  batch_size: 40                       # [assumed] one transport ship's load (30-50 [fan zk])
  duration_s: { mean: 75, sd: 5 }      # [fan dg] "just over a minute for the actual briefing"; 75 s [assumed] includes entering
  turnover_s: { mean: 30, sd: 5 }      # [assumed]
  fill_rule: full_or_max_wait
  max_fill_wait_s: 45                  # [assumed]
  release_rule: when_load_area_has_room
  load_area_capacity: 40               # [assumed] one ship's load waits at the boarding doors
  party_integrity: true
  merge_point: true                    # [assumed] Lightning Lane Single Pass merges before the briefing
  bypass_for_single_rider: false       # [fan] single riders go through the full preshows (BlogMickey, Oct 2024)

stages:
  - id: transport_ship                 # Intersystem Transport Ship: standing motion simulator [wiki][fan]
    enabled: true
    rooms: 3                           # [fan] "one of three identical rooms that rotate on a turntable" (starwars.archivum.wiki); modeled as 3 independent rooms
    batch_size: 40                     # [fan zk] "holds between 30-50 passengers"; 40 [assumed]
    duration_s: { mean: 150, sd: 5 }   # [fan dg] "just over 2.5 minutes"
    turnover_s: { mean: 30, sd: 5 }    # [assumed]
    fill_rule: full_or_max_wait
    max_fill_wait_s: 45                # [assumed]
    release_rule: when_load_area_has_room
    load_area_capacity: 48             # [assumed] the hangar walk and cell hallway hold three cells' worth
    party_integrity: true
  - id: holding_cell                   # [wiki] "small groups of no more than sixteen guests isolated in a holding cell"
    enabled: true
    rooms: 3                           # [assumed] number of cells not found
    batch_size: 16                     # [wiki][fan dg]; the cell's group boards one vehicle pair
    duration_s: { mean: 60, sd: 5 }    # [fan dg] "in the holding cell for about a minute only"
    turnover_s: { mean: 15, sd: 3 }    # [assumed]
    fill_rule: full_or_max_wait
    max_fill_wait_s: 30                # [assumed]
    release_rule: when_load_area_has_room
    load_area_capacity: 32             # [assumed] the group boarding and the next one at the doors
    party_integrity: true

queues:
  party_split_policy: never
  standby: { physical_capacity: 2300 } # [assumed] as the M9 simple ride
  single_rider: { enabled: false }     # [fan] a line has run but "doesn't seem to have been made a permanent addition yet" (BlogMickey, Oct 2024)
  skip_line:
    enabled: true                      # [wiki] Lightning Lane Single Pass
    merge_point: preshow_entrance      # [assumed]
    merge:
      unit: guests
      empty_lane_rule: pull_other
      phase_hysteresis_guests: 20      # [assumed]
      phases:                          # [assumed] same fan-reported placeholders as the other rides
        - { name: normal,   when_ll_queue_guests_below: 60,  ll_per_standby: 2 }
        - { name: elevated, when_ll_queue_guests_below: 200, ll_per_standby: 4 }
        - { name: recovery, when_ll_queue_guests_below: null, ll_per_standby: 10 }
  posted_wait: { algorithm: queue_len_over_throughput, padding_pct: 0 }

validation_targets:
  listed_capacity_per_hr: 1700
  implied_dispatch_interval_s: 37.4    # target 1,540/hr: 3600 x 16 / 1540
  theoretical_riders_per_hr_at_target: 1540
  expect_four_trains_sufficient: false # not meaningful here; 12 pairs in service
  avg_standby_wait_min_2026: 47        # [fan] Queue-Times 2026 (park calibration target)

config_invariants:                     # enforced by the loader, applies to every ride
  - "sum(block.transit_s.mean over non-station blocks) == ride.ride_duration_s (+/- 2 s)"
  - "count(blocks) >= trains.max_in_service + 1"
  - "trains.default_in_service <= trains.max_in_service <= trains.fleet_size"
  - "every block with kind=brake defines brake.hold_capable, brake.stop_policy and brake.release_delay_s"
  - "every stage (preshow and stages) has throughput >= ride.listed_capacity_per_hr; stages need the preshow and a unique id"

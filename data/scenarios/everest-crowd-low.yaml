# everest at a low crowd: standby demand ~80% of capacity (~1830/hr with the park mix and failures),
# Lightning Lane demand calibrated so the realized LL share lands near the [fan] 13% band (M4, docs/tuning-log.md).
# Confidence tags: [assumed] = our placeholder, tune later
schema_version: "1.0"
scenario:
  id: everest_crowd_low
  description: "constant low-crowd demand, park guest mix, all failures; LL share target ~13%"
  ride_id: wdw.ak.expedition_everest
  seed: 1
  duration_h: 11
  warmup_min: 60
  trains: 5
  failures: [brief_stop, long_downtime, cascade_stop]
  guests:
    park_id: synthetic_park_v0
    single_rider_share: 0.05           # [assumed]
  arrivals:
    - { at: "00:00", rate_per_hr: 1464 }     # [assumed] 80% of capacity
  lightning_lane:
    arrivals:
      - { at: "00:00", rate_per_hr: 219 }   # [assumed] calibrated to the 13% band

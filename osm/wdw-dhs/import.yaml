# Disney's Hollywood Studios — OSM import mapping for `ridesim osm-import` (M9, 2026-10-18).
# Names, lands and map numbers come from the 2026 guide map [map]; positions and walkway geometry from
# the OSM extract [osm] (© OpenStreetMap contributors, ODbL 1.0).
#   go run ./cmd/ridesim osm-import -config osm/wdw-dhs/import.yaml -out <draft.yaml> -svg <map.svg>
# Where OSM has no element for a guide-map location, a nearby element stands in ("stand-in" below);
# those positions are approximate until checked.

park:
  id: wdw_dhs
  name: "Disney's Hollywood Studios"
  extract: extract-2026-10-18.json
  boundary: w806728401                # tourism=theme_park outline; its north-west corner is the origin

walk:
  highways: [footway, pedestrian, steps, path, living_street]
  exclude_access: [private, "no"]     # backstage
  exclude_name_contains: [Queue]      # queue lines belong to the ride models, not the walkway graph
  snap_ft: 45                         # OSM paths often stop short of the path or plaza they meet
  cluster_ft: 25                      # one junction for a messy crossing
  exclude_inside: [w295048237]        # Fantasmic seating aisles: the show node holds its own audience
  widths_ft:                          # [assumed] defaults by path type; chokepoints to be measured [user]
    pedestrian: 40
    living_street: 30
    footway: 15
    steps: 10
    path: 8

nodes:
  - { id: gate, kind: entrance, name: "Main entrance", land: entrance, osm: [r3919136] }
  - { id: exit, kind: exit, name: "Main entrance", land: entrance, osm: [r3919136] }

  # rides
  - { id: runaway_railway, kind: ride_simple, name: "Mickey & Minnie's Runaway Railway", land: hollywood_boulevard, map_no: [1], osm: [w294898804] }
  - { id: star_tours, kind: ride_simple, name: "Star Tours – The Adventures Continue", land: echo_lake, map_no: [13], osm: [w294899629] }
  - { id: rise_of_the_resistance, kind: ride_simple, name: "Star Wars: Rise of the Resistance", land: galaxys_edge, map_no: [28], osm: [w751722737] }
  - { id: smugglers_run, kind: ride_simple, name: "Millennium Falcon: Smugglers Run", land: galaxys_edge, map_no: [29], osm: [w688502132] }
  - { id: alien_saucers, kind: ride_simple, name: "Alien Swirling Saucers", land: toy_story_land, map_no: [41], osm: [w685092734] }
  - { id: slinky_dog_dash, kind: ride_simple, name: "Slinky Dog Dash", land: toy_story_land, map_no: [42], osm: [w685092736] }
  - { id: toy_story_mania, kind: ride_simple, name: "Toy Story Mania!", land: toy_story_land, map_no: [43], osm: [w294905178], at: n6419360130 }   # entrance faces Toy Story Land, not Pixar Plaza
  - { id: tower_of_terror, kind: ride_simple, name: "The Twilight Zone Tower of Terror", land: sunset_boulevard, map_no: [56], osm: [w530750421] }
  - { id: rock_n_roller_coaster, kind: ride, name: "Rock 'n' Roller Coaster Starring The Muppets", land: sunset_boulevard, map_no: [57], osm: [w357021885] }


# EPCOT — OSM import mapping for `ridesim osm-import` (M17, 2026-10-19).
# Names, lands and map numbers come from the 2026 guide map (Jason's image) [map]; positions and walkway geometry from the
# OSM extract [osm] (© OpenStreetMap contributors, ODbL 1.0).
#   go run ./cmd/ridesim osm-import -config osm/wdw-epcot/import.yaml -out <draft.yaml> -svg <map.svg>
# Where OSM has no element for a guide-map location, a nearby element stands in ("stand-in" below) or it is listed as not imported.
# Lands: the four neighborhoods, and each World Showcase pavilion as its own land (shops are grouped per land).

park:
  id: wdw_epcot
  name: "EPCOT"
  extract: extract-2026-10-19.json
  boundary: w805298160                # tourism=theme_park outline; its north-west corner is the origin

walk:
  highways: [footway, pedestrian, steps, path, living_street]
  exclude_access: [private, "no"]     # backstage
  exclude_name_contains: [Queue]      # queue lines belong to the ride models, not the walkway graph
  snap_ft: 45                         # as Hollywood Studios
  cluster_ft: 25
  exclude_inside: []
  widths_ft:                          # [assumed] defaults by path type, as Hollywood Studios; chokepoints to be measured [user]
    pedestrian: 40
    living_street: 30
    footway: 15
    steps: 10
    path: 8

nodes:
  # gates (Jason: two gates). Main: the footway hub north of Spaceship Earth; International Gateway: its named path.
  - { id: gate, kind: entrance, name: "Main entrance", land: entrance, osm: [n8716534792] }
  - { id: exit, kind: exit, name: "Main entrance", land: entrance, osm: [n8716534792] }
  - { id: gate_ig, kind: entrance, name: "International Gateway", land: entrance, osm: [w1525709564] }

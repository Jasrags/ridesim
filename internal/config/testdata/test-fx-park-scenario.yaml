# Minimal valid park scenario fixture against test-fx-park.yaml. Broken variants are patches in scenario_test.go.
schema_version: "1.0"
scenario:
  id: fx_park_day
  park_id: fx_park
  seed: 1
  duration_h: 10
  warmup_min: 30
  crowd_level: medium
  walking_mode: fixed_delay
  failures: [cascade_stop]
  ops:
    - { at: "01:00", action: remove_train, node: coaster }
    - { at: "01:30", action: add_train, node: coaster }
    - { at: "02:00", action: close_ride, node: coaster, minutes: 20 }
    - { at: "03:00", action: crowd_scale, value: 1.5 }

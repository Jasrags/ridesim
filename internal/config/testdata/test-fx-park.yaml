# Minimal valid park fixture. Broken variants are produced by one-line patches in invariants_test.go.
schema_version: "1.0"
park: { id: fx_park, open_hour: 9, close_hour: 18, walking_mode: congestion }
nodes:
  - { id: gate, kind: entrance }
  - { id: hub, kind: plaza, comfortable_guests: 100 }
  - { id: coaster, kind: ride, ride_id: test.fx.coaster, appeal: 0.5, thrill: 0.5 }
  - { id: filler, kind: ride_simple, capacity_per_hr: 100, duration_s: 60, appeal: 0.1, thrill: 0.1 }
  - { id: theater, kind: show, capacity_guests: 10, duration_min: 5, schedule: ["10:00"], exit_edge: theater_hub, appeal: 0.1 }
  - { id: dining, kind: dining, seats: 10, service_time_min: { mean: 30, sd: 5 }, appeal: 0.1 }
  - { id: exit, kind: exit }
edges:
  - { id: gate_hub, from: gate, to: hub, length_ft: 100, width_ft: 10 }
  - { id: hub_coaster, from: hub, to: coaster, length_ft: 100, width_ft: 10 }
  - { id: hub_filler, from: hub, to: filler, length_ft: 100, width_ft: 10 }
  - { id: theater_hub, from: theater, to: hub, length_ft: 100, width_ft: 10 }
  - { id: hub_dining, from: hub, to: dining, length_ft: 100, width_ft: 10 }
  - { id: hub_exit, from: hub, to: exit, length_ft: 100, width_ft: 10 }
congestion:
  free_speed_fps: 4.0
  comfortable_density_per_sqft: 0.1
  alpha: 1.5
  beta: 3
  jam_density_per_sqft: 0.3
  spillback: { enabled: true, width_consumed_ft_per_100_guests: 1.5, applies_to: [hub_coaster] }
guests:
  daily_attendance: { low: 100, medium: 200, high: 300 }
  arrival_curve_share_by_hour: { "9": 0.6, "10": 0.4 }
  party_size: { 1: 0.5, 2: 0.5 }
  stay_hours: { mean: 4, sd: 1 }
  patience_min: { mean: 30, sd: 10 }
  thrill_tolerance: { mean: 0.5, sd: 0.2 }
  ll_passes_per_guest: { mean: 1, sd: 0.5 }
decision:
  method: softmax_utility
  temperature: 0.25
  choice_set: top_k_by_utility
  k: 3
  utility: { appeal: 1.0, thrill_match: 0.6, wait_penalty_per_min: 0.03, walk_penalty_per_min: 0.05, repeat_penalty: 0.8, ll_return_window_bonus: 0.5 }
  posted_wait_refresh_s: 300
  fatigue_per_hour: 0.06
  meal_windows: ["11:30-13:30"]
